<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bloom by Giang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap">
<style>
/* Layout: mobile-first app, bottom tab bar, bottom sheets for detail and forms; centered column on wide screens */
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --surface2:#EAEEF0; --ink:#1F2A33; --muted:#5B6770; --line:#DCE3E7;
  --accent:#3F6B8F; --accent-ink:#FFFFFF; --accent-soft:#DFE9F1; --danger:#B3261E;
  --s1-fg:#8A5A0B; --s1-bg:#FBEBC8;
  --s2-fg:#2B5AA3; --s2-bg:#DCE7F7;
  --s3-fg:#62459E; --s3-bg:#E6DFF5;
  --s4-fg:#256B4B; --s4-bg:#D6EEE0;
  --s5-fg:#6B6366; --s5-bg:#ECE6E8; --late-fg:#B3261E; --late-bg:#FADDDA;
  --shadow:0 1px 2px rgba(60,20,35,.06),0 8px 24px rgba(60,20,35,.07);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10181F; --surface:#18232C; --surface2:#213039; --ink:#EAF0F4; --muted:#98A9B5; --line:#2B3B46;
  --accent:#8DB6DA; --accent-ink:#0B1A26; --accent-soft:#1E3445; --danger:#FF8A80;
  --s1-fg:#F2C874; --s1-bg:#3F3015; --s2-fg:#9DBDF0; --s2-bg:#1F3050; --s3-fg:#C6B3F0; --s3-bg:#33284F;
  --s4-fg:#8ED9B1; --s4-bg:#1B3A2B; --s5-fg:#BDB3B7; --s5-bg:#372D32; --late-fg:#FF8A80; --late-bg:#4A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181F; --surface:#18232C; --surface2:#213039; --ink:#EAF0F4; --muted:#98A9B5; --line:#2B3B46;
  --accent:#8DB6DA; --accent-ink:#0B1A26; --accent-soft:#1E3445; --danger:#FF8A80;
  --s1-fg:#F2C874; --s1-bg:#3F3015; --s2-fg:#9DBDF0; --s2-bg:#1F3050; --s3-fg:#C6B3F0; --s3-bg:#33284F;
  --s4-fg:#8ED9B1; --s4-bg:#1B3A2B; --s5-fg:#BDB3B7; --s5-bg:#372D32; --late-fg:#FF8A80; --late-bg:#4A1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;padding-inline:16px;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin-inline:auto;padding-block:12px 112px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:12px;padding-block:10px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-logo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#F6F3EC;border:1px solid var(--line)}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--f-display);font-style:italic;font-size:22px;line-height:1;white-space:nowrap}
.brand-sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-top:3px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);
  border:1px solid var(--line);flex:none}
.icon-btn svg{width:20px;height:20px}

/* page heading */
.h1{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 14px;flex-wrap:wrap}
.pagehead>div{min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;
  border-radius:999px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn svg{width:18px;height:18px}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat.hero .lbl{color:inherit;opacity:.85}
.stat .val{font-family:var(--f-display);font-size:clamp(17px,5.4vw,26px);line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.stat .val small{font-family:var(--f-body);font-size:13px;font-weight:600;margin-left:2px}

/* date bar */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.datebar input[type=date]{flex:1;min-width:0;height:44px}
.datebar .icon-btn{border-radius:14px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip b{font-weight:700}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st1{color:var(--s1-fg);background:var(--s1-bg)} .st2{color:var(--s2-fg);background:var(--s2-bg)}
.st3{color:var(--s3-fg);background:var(--s3-bg)} .st4{color:var(--s4-fg);background:var(--s4-bg)}
.st5{color:var(--s5-fg);background:var(--s5-bg)}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=search],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;min-height:44px;padding:10px 14px;font-size:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  outline:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-width:0}
.grid2>*{min-width:0}
.chart text.vl{fill:var(--ink);font-weight:600}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{margin-bottom:12px}

/* order cards */
.list{display:flex;flex-direction:column;gap:10px}
.daylabel{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 2px 2px}
.order{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--shadow)}
.thumb{width:72px;height:72px;border-radius:14px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:30px;height:30px}
.order .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.order .name{font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.order .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px}
.order .price{font-weight:700;color:var(--accent);white-space:nowrap}
.stats.today{grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr) minmax(0,.8fr)}
.stat.hero .val{font-size:clamp(15px,5vw,24px);white-space:nowrap;overflow-wrap:normal}
.ogroup{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 10px 4px;box-shadow:var(--shadow);border-left:4px solid var(--accent)}
.ogroup .ghead{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ogroup .ghead>div{flex:1;min-width:0;overflow-wrap:anywhere}
.ogroup .gtot{font-weight:700;color:var(--accent);white-space:nowrap}
.ogroup .order{background:transparent;border:0;border-radius:0;box-shadow:none;padding:10px 0;border-top:1px solid var(--line)}
.ogroup .order:first-of-type{border-top:0}
.hasnote{display:inline-flex;align-items:center;gap:4px;color:var(--s1-fg);background:var(--s1-bg);border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:600}
.advrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn.ghost{background:var(--surface2);border-color:transparent;color:var(--muted)}
.advrow .advance{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.due{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--ink);border-radius:9px;padding:1px 9px}
.due.big{font-size:17px;padding:3px 11px}
.due.urgent{background:var(--s1-bg);color:var(--s1-fg)}
.due.late{background:var(--late-bg);color:var(--late-fg)}
.tag.rank{background:var(--accent);color:var(--accent-ink)}
/* generic rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.rowitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:10px 12px;width:100%;text-align:left}
.rowitem .grow{flex:1;min-width:0}
.rowitem .t{font-weight:600;overflow-wrap:anywhere}
.rowitem .s{font-size:12.5px;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:20px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);
  border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:13px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:720px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;
  height:52px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;
  display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(20,45,70,.3)}
.fab svg{width:20px;height:20px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(20,8,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-head .h1{font-size:22px}
.big-price{font-family:var(--f-display);font-size:34px;color:var(--accent);line-height:1.1}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.cardmsg{background:var(--s1-bg);color:var(--s1-fg);border-radius:16px;padding:12px 14px;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.cardmsg small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.photo{width:100%;max-height:300px;object-fit:cover;border-radius:18px;display:block}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:8px 0;text-align:left;width:100%;position:relative}
.step .dot{width:34px;height:34px;border-radius:50%;background:var(--surface2);color:var(--muted);display:grid;place-items:center;flex:none;z-index:1}
.step .dot svg{width:18px;height:18px}
.step.done .dot{background:var(--accent-soft);color:var(--accent)}
.step.now .dot{background:var(--accent);color:var(--accent-ink)}
.step:not(:last-child)::after{content:"";position:absolute;left:16px;top:42px;bottom:-8px;width:2px;background:var(--line)}
.step .tt{font-weight:600}.step.todo .tt{color:var(--muted)}
.step .ds{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.upload{display:flex;align-items:center;gap:12px}
.upload .thumb{width:84px;height:84px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}

/* report */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.bar{fill:var(--accent)} .bar.zero{fill:var(--line)}
.grid-line{stroke:var(--line);stroke-width:1}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px;margin-top:10px}
.barrow .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.barrow .fill{height:100%;background:var(--accent);border-radius:4px}
.sec-title{font-weight:700;margin:18px 2px 8px}

.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.pre{background:var(--accent-soft);color:var(--accent)}
.tag.urgent{background:var(--s1-bg);color:var(--s1-fg)}
.tag.late{background:var(--late-bg);color:var(--late-fg)}
.tag.owe{background:var(--surface2);color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.totalbox{min-height:44px;display:flex;align-items:center;padding:0 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.slip{width:100%;min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px}
.seg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;max-width:90%}
@media (max-width:420px){.kv{grid-template-columns:92px minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
<div class="wrap">

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (Math.round(Number(n) || 0)).toLocaleString('vi-VN') + ' ₫';
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const dmy = s => { const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; };
const WD = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
const dayName = s => WD[fromYmd(s).getDay()];
const uid = () => 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let TODAY = ymd(new Date());
const initials = n => (n || '?').trim().split(/\s+/).slice(-2).map(w => w[0]).join('').toUpperCase();

/* money: price is per bouquet; total = price x qty + ship - discount */
/* an amount under 1.000 is read as nghìn đồng: typing 780 means 780.000 ₫ */
const vnd = v => { v = Number(v) || 0; return v > 0 && v < 1000 ? v * 1000 : v; };
const totalOf = o => Math.max(0, vnd(o.price) * (Number(o.qty) || 1) + vnd(o.ship) - vnd(o.discount));
const collectedOf = o => o.status === 'canceled' ? 0 : (o.paid ? totalOf(o) : Math.min(vnd(o.deposit), totalOf(o)));
const remainOf = o => o.status === 'canceled' ? 0 : Math.max(totalOf(o) - collectedOf(o), 0);
const custKey = o => String(o.phone || '').replace(/\D/g, '') || String(o.customer || '').trim().toLowerCase();
const createdYmd = o => { const d = o.created ? new Date(o.created) : null; return d && !isNaN(d) ? ymd(d) : o.date; };
const daysBetween = (a, b) => Math.round((fromYmd(b) - fromYmd(a)) / 86400000);
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const dueMin = o => { const m = /^(\d{1,2}):(\d{2})$/.exec(o.time || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
/* flags: late (past due, not finished), urgent (due within 2h, not delivered yet), pre (ordered 1+ day ahead) */
function flagsOf(o) {
  const f = { late: false, urgent: false, pre: false, left: '' };
  if (!(o.status === 'pending' || o.status === 'making' || o.status === 'shipping')) return f;
  const due = dueMin(o);
  f.late = o.date < TODAY || (o.date === TODAY && due != null && due < nowMin());
  if (!f.late && o.date === TODAY && due != null) {
    const d = due - nowMin();
    if (d <= 120) { f.urgent = true; f.left = d < 60 ? d + ' phút' : Math.floor(d / 60) + 'g' + (d % 60 ? pad(d % 60) : ''); }
  }
  f.pre = !f.late && o.date >= TODAY && daysBetween(createdYmd(o), o.date) >= 1;
  return f;
}

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

/* photos live in IndexedDB (hundreds of MB) so they never fill the small localStorage quota */
const IMG = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('bloom-images', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('img');
        r.onsuccess = () => { this.db = r.result; res(r.result); };
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      } catch (e) { rej(e); }
    });
  },
  run(mode, fn) {
    return this.open().then(db => new Promise((res, rej) => {
      const tx = db.transaction('img', mode), st = tx.objectStore('img');
      const out = fn(st);
      tx.oncomplete = () => res(out && 'result' in out ? out.result : true);
      tx.onerror = tx.onabort = () => rej(tx.error || new Error('idb'));
    }));
  },
  async put(id, data) { try { await this.run('readwrite', st => st.put(data, id)); return true; } catch (e) { return false; } },
  async del(id) { try { await this.run('readwrite', st => st.delete(id)); return true; } catch (e) { return false; } },
  async all() {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => {
        const out = {}, tx = db.transaction('img', 'readonly'), c = tx.objectStore('img').openCursor();
        c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } };
        tx.oncomplete = () => res(out); tx.onerror = tx.onabort = () => rej(tx.error);
      });
    } catch (e) { return {}; }
  }
};
const inIdb = new Set();
const liteOrder = o => (o.image && inIdb.has(o.id)) ? Object.assign({}, o, { image: '', hasImg: 1 }) : o;
async function localWrite(col, changed, removedIds) {
  if (col === 'orders') {
    for (const it of changed || []) {
      if (it.image) { if (await IMG.put(it.id, it.image)) inIdb.add(it.id); else inIdb.delete(it.id); }
      else if (inIdb.has(it.id)) { await IMG.del(it.id); inIdb.delete(it.id); }
    }
    for (const id of removedIds || []) if (inIdb.has(id)) { await IMG.del(id); inIdb.delete(id); }
    return LS.set(lsKey.orders, S.orders.map(liteOrder));
  }
  return LS.set(lsKey[col], S[col]);
}
async function hydrateImages() {
  const all = await IMG.all();
  let moved = false;
  for (const o of S.orders) {
    if (o.hasImg) { if (all[o.id]) { o.image = all[o.id]; inIdb.add(o.id); } delete o.hasImg; }
    else if (o.image && !inIdb.has(o.id)) { if (await IMG.put(o.id, o.image)) { inIdb.add(o.id); moved = true; } }
  }
  if (moved) LS.set(lsKey.orders, S.orders.map(liteOrder));
  onChange();
}

/* optimistic save: show the change at once, put things back if the save fails */
async function saveItem(col, item) {
  const i = S[col].findIndex(x => x.id === item.id);
  const prev = i >= 0 ? S[col][i] : null;
  if (i >= 0) S[col][i] = item; else S[col].push(item);
  onChange();
  const revert = () => {
    const j = S[col].findIndex(x => x.id === item.id);
    if (prev) { if (j >= 0) S[col][j] = prev; } else if (j >= 0) S[col].splice(j, 1);
    onChange();
  };
  if (S.mode === 'db' && S.db) {
    try { await S.db.collection(col).doc(item.id).set(item); dismissDemo(); return true; }
    catch (e) {
      revert();
      toast(e && e.code === 'quota_exceeded' ? 'Bộ nhớ đã đầy, hãy xóa bớt ảnh cũ' :
        e && e.code === 'invalid_argument' ? 'Tài khoản này chỉ được xem, không ghi được' : 'Chưa lưu được, thử lại sau');
      return false;
    }
  }
  if (!(await localWrite(col, [item]))) { revert(); toast('Bộ nhớ trình duyệt đầy. Hãy sao lưu rồi xóa bớt đơn cũ.'); return false; }
  dismissDemo(); return true;
}
async function removeItem(col, id) {
  const gone = S[col].find(x => x.id === id);
  S[col] = S[col].filter(x => x.id !== id);
  onChange();
  if (S.mode === 'db' && S.db) {
    try { await S.db.collection(col).doc(id).delete(); }
    catch (e) { if (gone) S[col].push(gone); onChange(); toast('Chưa xóa được, thử lại sau'); }
  } else await localWrite(col, [], [id]);
}

async function initStore() {
  let db = null;
  try { db = window.claude && await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) {
    // chạy file lẻ không có server: dùng bộ nhớ trình duyệt
    S.orders = LS.get(lsKey.orders) || [];
    S.flowers = LS.get(lsKey.flowers) || [];
    S.ready = true; onChange(); hydrateImages(); return;
  }
  // có server: chỉ hiển thị dữ liệu database trả về
  S.db = db; S.mode = 'db'; S.orders = []; S.flowers = [];
  const sub = (col) => db.collection(col).onSnapshot(snap => {
    S[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.loaded[col] = true; S.connErr = false; S.ready = true; onChange();
  }, () => {
    // máy chủ đang ngủ/khởi động: chưa có dữ liệu thì báo đang kết nối, không báo lỗi
    if (!S.loaded.orders) { S.connErr = true; render(); } else toast('Mất kết nối server, đang thử lại');
  });
  sub('orders'); sub('flowers');
  render();
  setTimeout(() => { if (!S.loaded.orders) { S.slow = true; render(); } }, 4000);
}

const revenueOf = o => o.status === 'canceled' ? 0 : totalOf(o);
function customersFrom(orders) {
  const m = new Map();
  orders.forEach(o => {
    const key = custKey(o);
    if (!key) return;
    const c = m.get(key) || { key, name: o.customer || o.phone, phone: o.phone || '', n: 0, total: 0, last: '' };
    c.n += 1; c.total += revenueOf(o); if (o.phone) c.phone = o.phone;
    if (o.date > c.last) { c.last = o.date; c.name = o.customer || c.name; }
    m.set(key, c);
  });
  return [...m.values()].sort((a, b) => b.total - a.total);
}

/* orders from one customer placed together (Bó 1, Bó 2...) show as one block */
function unitsOf(list) {
  const m = new Map(), out = [];
  list.forEach(o => {
    const k = o.group ? o.group + '|' + o.date : o.id;
    if (m.has(k)) m.get(k).push(o); else { const u = [o]; m.set(k, u); out.push(u); }
  });
  out.forEach(u => u.sort((a, b) => (a.part || 0) - (b.part || 0)));
  return out;
}
const unitOpen = u => u.some(o => !['done', 'canceled'].includes(o.status));

  if (u.length === 1) return orderCard(u[0], rank);

    u.map(o => orderCard(o, 0, true)).join('') + '</div>';
}

/* ---------- Báo cáo ---------- */
function viewReport() {
  const { orders, demo } = visible();
  const t = fromYmd(TODAY), Y = t.getFullYear(), M = t.getMonth(), last = new Date(Y, M + 1, 0).getDate();
  const wk = Math.min(4, Math.max(1, V.week || Math.ceil(t.getDate() / 7)));
  const cols = []; let from, to, what, title;
  if (V.range === 'year') {
    for (let m = 0; m < 12; m++) cols.push({ key: Y + '-' + pad(m + 1), label: 'T' + (m + 1), by: 'month' });
    from = Y + '-01-01'; to = Y + '-12-31'; what = 'Năm ' + Y; title = 'Doanh thu theo tháng';
  } else {
    const a = V.range === 'month' ? 1 : (wk - 1) * 7 + 1, b = V.range === 'month' ? last : (wk === 4 ? last : wk * 7);
    for (let d = a; d <= b; d++) cols.push({ key: Y + '-' + pad(M + 1) + '-' + pad(d), label: pad(d) + '/' + pad(M + 1) });
    from = cols[0].key; to = cols[cols.length - 1].key;
    what = V.range === 'month' ? 'Tháng ' + (M + 1) + '/' + Y : 'Tuần ' + wk + ' · ' + dmy(from).slice(0, 5) + ' đến ' + dmy(to).slice(0, 5);
    title = 'Doanh thu theo ngày';
  }
  const inR = orders.filter(o => o.date >= from && o.date <= to && o.status !== 'canceled');
  const per = cols.map(c => inR.filter(o => c.by === 'month' ? o.date.slice(0, 7) === c.key : o.date === c.key).reduce((s, o) => s + totalOf(o), 0));
  const rev = per.reduce((a, b) => a + b, 0), n = inR.length;
  const got = inR.reduce((s, o) => s + collectedOf(o), 0), owed = inR.reduce((s, o) => s + remainOf(o), 0);
  const max = Math.max(...per, 0);
  const niceTop = v => { if (v <= 0) return 100000; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };
  const short = v => v >= 1e6 ? (v / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + 'tr' : v >= 1e3 ? Math.round(v / 1e3).toLocaleString('vi-VN') + 'k' : String(Math.round(v));
  const top = Math.max(30000000, niceTop(max));
  const fr = top === 30000000 ? [0, 1 / 3, 2 / 3, 1] : [0, .5, 1];
  const W = 640, H = 220, L = 46, B = 26, T = 16, cw = W - L - 8, ch = H - B - T, bw = cw / cols.length;
  let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + title + '">';
  fr.forEach(f => { const y = T + ch - ch * f; svg += '<line class="grid-line" x1="' + L + '" x2="' + (W - 8) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + short(top * f) + '</text>'; });
  const every = cols.length > 14 ? 5 : 1, showAll = cols.length <= 14;
  per.forEach((v, i) => {
    const h = ch * v / top, x = L + i * bw + bw * .18, w = bw * .64, bh = Math.max(h, 2);
    svg += '<rect class="bar' + (v ? '' : ' zero') + '" x="' + x + '" y="' + (T + ch - bh) + '" width="' + w + '" height="' + bh + '" rx="3"/>';
    if (v && (showAll || v === max)) svg += '<text class="vl" x="' + (x + w / 2) + '" y="' + (T + ch - bh - 4) + '" text-anchor="middle">' + short(v) + '</text>';
    if (i % every === 0 || i === cols.length - 1) svg += '<text x="' + (x + w / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + cols[i].label + '</text>';
  });
  if (!rev) svg += '<text x="' + (W / 2) + '" y="' + (T + ch / 2) + '" text-anchor="middle">Chưa có doanh thu trong khoảng này</text>';
  svg += '</svg>';
  const byName = {}; inR.forEach(o => { byName[o.name] = (byName[o.name] || 0) + 1; });
  const topN = Object.entries(byName).sort((a, b) => b[1] - a[1]).slice(0, 5), topMax = topN.length ? topN[0][1] : 1;
  const byCh = {}; inR.forEach(o => { byCh[o.channel || 'Khác'] = (byCh[o.channel || 'Khác'] || 0) + 1; });
  const chList = Object.entries(byCh).sort((a, b) => b[1] - a[1]), chMax = chList.length ? chList[0][1] : 1;
  const rg = [['week', '7 ngày'], ['month', 'Tháng này'], ['year', 'Năm nay']];
  return demoBanner(demo) + '<div class="pagehead"><div><h1 class="h1">Báo cáo</h1><div class="sub">' + what + ' · không tính đơn đã huỷ</div></div></div>' +
    '<div class="chips">' + rg.map(r => '<button class="chip" type="button" data-range="' + r[0] + '" aria-pressed="' + (V.range === r[0]) + '">' + r[1] + '</button>').join('') + '</div>' +
    (V.range === 'week' ? '<div class="chips">' + [1, 2, 3, 4].map(w => '<button class="chip" type="button" data-week="' + w + '" aria-pressed="' + (wk === w) + '">Tuần ' + w + '</button>').join('') + '</div>' : '') +
    '<div class="stats"><div class="stat hero" style="grid-column:1/-1"><div class="lbl">Doanh thu · trung bình ' + money(n ? rev / n : 0) + '/đơn</div><div class="val num" style="font-size:34px">' + money(rev) + '</div></div>' +
    '<div class="stat"><div class="lbl">Số đơn</div><div class="val num">' + n + '</div></div>' +
    '<div class="stat"><div class="lbl">Đã thu</div><div class="val num">' + got.toLocaleString('vi-VN') + '<small>₫</small></div></div>' +
    '<div class="stat"><div class="lbl">Còn thu</div><div class="val num" style="color:' + (owed ? 'var(--late-fg)' : 'inherit') + '">' + owed.toLocaleString('vi-VN') + '<small>₫</small></div></div></div>' +
    '<div class="card"><div style="font-weight:700;margin-bottom:8px">' + title + '</div>' + svg + '</div>' +
    '<div class="sec-title">Mẫu bán chạy</div><div class="card">' + (topN.length ? topN.map(([k, v]) => '<div class="barrow"><span>' + esc(k) + '</span><b class="num">' + v + ' đơn</b><div class="track"><div class="fill" style="width:' + (v / topMax * 100) + '%"></div></div></div>').join('') : '<span class="sub">Chưa có dữ liệu</span>') + '</div>' +
    '<div class="sec-title">Khách đến từ</div><div class="card">' + (chList.length ? chList.map(([k, v]) => '<div class="barrow"><span>' + esc(k) + '</span><b class="num">' + v + ' đơn</b><div class="track"><div class="fill" style="width:' + (v / chMax * 100) + '%"></div></div></div>').join('') : '<span class="sub">Chưa có dữ liệu</span>') + '</div>';
}

/* ---------- image: shrink before saving ---------- */
function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        const m = 640, k = Math.min(1, m / Math.max(im.width, im.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.72));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function hasData() {
  if (S.orders.length || S.flowers.length) return true;

}
async function downloadBackup() {
  if (!hasData()) return;
  // chế độ server: lấy bản sao lưu đầy đủ (kèm ảnh) từ server
  const text = (S.mode === 'db' && window.bloomExportText) ? await window.bloomExportText().catch(() => backupText()) : backupText();
  const filename = BK_NAME + TODAY + '.json';
  let dl = null;
  try { dl = window.claude && await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); toast('Đã lưu file sao lưu'); }
    catch (e) { toast(e && e.code === 'declined' ? 'Chưa lưu file. Bạn có thể bấm Sao chép dữ liệu.' : 'Không tải được file, hãy bấm Sao chép dữ liệu'); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Đang tải file sao lưu. Nếu không thấy file, bấm Sao chép dữ liệu.');
  } catch (e) { copyBackup(); }
}
async function copyBackup() {
  if (!hasData()) return;
  // chế độ server: sao chép bản đầy đủ (kèm ảnh) giống file tải về, để khôi phục được ở bất kỳ đâu
  const t = (S.mode === 'db' && window.bloomExportText) ? await window.bloomExportText().catch(() => backupText()) : backupText();
  const manual = () => { const b = $('#bkText'); if (b) { b.value = t; b.focus(); b.select(); } toast('Giữ vào ô bên dưới rồi chọn Sao chép'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('Đã sao chép. Dán vào Ghi chú hoặc Zalo để giữ.'), manual);
  else manual();
}

/* only accept what the app itself writes: clean every field, drop anything malformed */
const str = (v, n) => String(v == null ? '' : v).slice(0, n);
const num = v => { v = Number(v); return isFinite(v) && v >= 0 ? v : 0; };
const okImg = v => typeof v === 'string' && (/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(v) || /^\/api\/images\/[a-f0-9]{32}$/.test(v)) ? v : '';
function cleanOrder(o) {
  if (!o || typeof o !== 'object' || typeof o.id !== 'string' || !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(o.id)) return null;
  if (typeof o.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(o.date) || !str(o.name, 200).trim()) return null;
  return { id: o.id, name: str(o.name, 200), customer: str(o.customer, 200), phone: str(o.phone, 50), channel: str(o.channel, 40) || 'Instagram',
    status: ST[o.status] ? o.status : 'pending', date: o.date, time: /^\d{2}:\d{2}$/.test(o.time) ? o.time : '',
    price: num(o.price), qty: Math.max(1, Math.round(num(o.qty)) || 1), ship: num(o.ship), discount: num(o.discount), deposit: num(o.deposit),
    paid: o.paid === true, address: str(o.address, 500), note: str(o.note, 2000), image: okImg(o.image),
    group: /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(o.group) ? o.group : undefined, part: o.group && Number(o.part) >= 1 ? Math.min(20, Math.round(Number(o.part))) : undefined, of: o.group && Number(o.of) >= 1 ? Math.min(20, Math.round(Number(o.of))) : undefined,
    created: typeof o.created === 'string' && !isNaN(new Date(o.created)) ? o.created : new Date().toISOString() };
}
function cleanFlower(f) {
  if (!f || typeof f !== 'object' || typeof f.id !== 'string' || !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(f.id) || !str(f.name, 200).trim()) return null;
  return { id: f.id, name: str(f.name, 200), price: num(f.price) };
}
async function bulkSave(col, items) {
  items.forEach(item => { const i = S[col].findIndex(x => x.id === item.id); if (i >= 0) S[col][i] = item; else S[col].push(item); });
  dismissDemo(); onChange();
  if (S.mode === 'db' && S.db) { for (const item of items) await S.db.collection(col).doc(item.id).set(item); }
  else if (!(await localWrite(col, items))) throw new Error('storage full');
}
async function restoreFrom(text) {
  let d;
  try { d = JSON.parse(String(text).trim()); } catch (e) { setMsg('Nội dung không đúng định dạng sao lưu.'); return; }
  const orders = (Array.isArray(d && d.orders) ? d.orders : []).map(cleanOrder).filter(Boolean);
  const flowers = (Array.isArray(d && d.flowers) ? d.flowers : []).map(cleanFlower).filter(Boolean);
  if (!orders.length && !flowers.length) { setMsg('Không tìm thấy đơn hay mẫu hoa hợp lệ trong nội dung này.'); return; }
  setMsg('Đang khôi phục...');
  try {
    await bulkSave('orders', orders); await bulkSave('flowers', flowers);
    const msg = 'Đã khôi phục ' + orders.length + ' đơn và ' + flowers.length + ' mẫu hoa.';
    if (sheetKind === 'form' && $('#bkMsg')) { setSheet(backupSheet(), 'form'); setMsg(msg); }
    toast(msg);
  } catch (e) { setMsg('Khôi phục chưa xong, bộ nhớ đầy hoặc mất kết nối. Hãy thử lại.'); }
}
function handleBackupFile(file) {
  const fr = new FileReader();
  fr.onerror = () => setMsg('Không đọc được file này.');
  fr.onload = () => restoreFrom(fr.result);
  fr.readAsText(file);
}

    const old = S.orders.find(x => x.id === id);
    const n = k => Math.max(0, Number($(k).value) || 0), mn = k => vnd(n(k));
    const item = { id, name, customer: $('#fCust').value.trim(), phone: $('#fPhone').value.trim(), channel: $('#fChan').value, status: $('#fStat').value,
      date, time: $('#fTime').value, price: mn('#fPrice'), qty: Math.max(1, Math.round(Number($('#fQty').value) || 1)), ship: mn('#fShip'), discount: mn('#fDisc'),
      deposit: mn('#fDep'), paid: $('#fPaid').checked, address: $('#fAddr').value.trim(), note: $('#fNote').value.trim(), image: formImage,
      created: old ? old.created : new Date().toISOString() };
    if (old && old.group) { item.group = old.group; item.part = old.part; item.of = old.of; }
    const extras = [];
    if (!old) {
      for (const b of document.querySelectorAll('.xblock')) {
        const k = b.dataset.n, xn = $('#xName' + k).value.trim(), pr = $('#xPrice' + k).value, ad = $('#xAddr' + k).value.trim(), nt = $('#xNote' + k).value.trim(), im = extraImages[k] || '';
        if (!xn && !pr && !ad && !nt && !im) { toast('Bó ' + k + ' chưa nhập gì. Hãy điền hoặc bấm Bỏ bó này.'); return; }
        extras.push({ id: uid(), name: xn || name, customer: item.customer, phone: item.phone, channel: item.channel, status: item.status, date, time: item.time,
          price: vnd(Math.max(0, Number(pr) || 0)), qty: 1, ship: 0, discount: 0, deposit: 0, paid: item.paid, address: ad, note: nt, image: im,
          created: item.created, part: Number(k) });
      }
      if (extras.length) { const g = 'g' + id; item.group = g; item.part = 1; item.of = extras.length + 1; extras.forEach(x => { x.group = g; x.of = extras.length + 1; }); }
    }
    const ok = await saveItem('orders', item);
    if (!ok) return;
    let saved = 1;
    for (const x of extras) { if (await saveItem('orders', x)) saved++; else break; }
    if (saved < extras.length + 1) { setSheet(''); V.date = date; toast('Chỉ lưu được ' + saved + '/' + (extras.length + 1) + ' bó. Hãy thêm các bó còn lại bằng đơn mới.'); return; }
    setSheet(''); V.date = date; toast(extras.length ? 'Đã lưu ' + saved + ' bó' : 'Đã lưu đơn');
  }
  if (e.target.id === 'flowerForm') {
    const name = $('#gName').value.trim(); if (!name) { toast('Cần nhập tên mẫu'); return; }
    const id = e.target.dataset.id || uid();
    const ok = await saveItem('flowers', { id, name, price: vnd($('#gPrice').value) });
    if (ok) { setSheet(''); toast('Đã lưu mẫu hoa'); }
  }
}

/* ---------- theme ---------- */
$('#themeBtn').addEventListener('click', () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('fm_theme', r.dataset.theme); } catch (er) {}
});
try { const th = localStorage.getItem('fm_theme'); if (th) document.documentElement.dataset.theme = th; } catch (er) {}

/* tags like "Gấp" and "Quá hạn" depend on the clock: refresh each minute, never while a form or field is in use */
setInterval(() => {
  const t = ymd(new Date());
  if (t !== TODAY) { if (V.date === TODAY) V.date = t; TODAY = t; }
  const a = document.activeElement;
  if (!sheetKind && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) render();
}, 60000);

render();
initStore();

</script>
