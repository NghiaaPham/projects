name: bloom-by-giang CI
on:
  push:
    paths: ['bloom-by-giang/**', '.github/workflows/bloom-by-giang.yml']
  pull_request:
    paths: ['bloom-by-giang/**']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bloom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bloom-by-giang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bloom-by-giang/package-lock.json
      - run: npm ci
      - name: Test (pg-mem)
        run: npm test
      - name: Test (PostgreSQL 16 thật)
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bloom_test
      - run: npm audit --omit=dev --audit-level=high
