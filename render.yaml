services:
  - type: web
    name: bloom-by-giang
    runtime: node
    rootDir: bloom-by-giang
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SHOP_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
